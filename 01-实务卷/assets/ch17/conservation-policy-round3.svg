<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1075" viewBox="0 0 1600 1075"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#51758f"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="50" y="65" text-anchor="start" font-size="38" font-weight="700" fill="#173650"><tspan x="50" dy="0">《实施全面节约战略行动方案》</tspan></text><text x="50" y="106" text-anchor="start" font-size="23" font-weight="400" fill="#173650"><tspan x="50" dy="0">国家层面政策要点</tspan></text><text x="50" y="155" text-anchor="start" font-size="27" font-weight="600" fill="#173650"><tspan x="50" dy="0">2030年主要目标</tspan></text><text x="50" y="192" text-anchor="start" font-size="23" font-weight="400" fill="#173650"><tspan x="50" dy="0">全面节约制度更加健全，资源利用效率明显提高。</tspan></text><text x="50" y="226" text-anchor="start" font-size="23" font-weight="400" fill="#173650"><tspan x="50" dy="0">进一步形成崇尚节约的社会风尚。</tspan></text><rect x="50" y="246" width="286" height="156" rx="12" fill="#e8f0f6"/><text x="66" y="279" text-anchor="start" font-size="22" font-weight="400" fill="#173650"><tspan x="66" dy="0">单位GDP能耗</tspan></text><text x="66" y="370" text-anchor="start" font-size="23" font-weight="600" fill="#173650"><tspan x="66" dy="0">比2025年降低10%左右</tspan></text><rect x="352" y="246" width="286" height="156" rx="12" fill="#e8f0f6"/><text x="368" y="279" text-anchor="start" font-size="22" font-weight="400" fill="#173650"><tspan x="368" dy="0">单位GDP用水量</tspan></text><text x="368" y="370" text-anchor="start" font-size="23" font-weight="600" fill="#173650"><tspan x="368" dy="0">比2025年降低10%</tspan></text><rect x="654" y="246" width="286" height="156" rx="12" fill="#e8f0f6"/><text x="670" y="279" text-anchor="start" font-size="22" font-weight="400" fill="#173650"><tspan x="670" dy="0">单位GDP建设用地</tspan><tspan x="670" dy="30.799999999999997">使用面积</tspan></text><text x="670" y="370" text-anchor="start" font-size="23" font-weight="600" fill="#173650"><tspan x="670" dy="0">比2025年降低15%</tspan></text><rect x="956" y="246" width="286" height="156" rx="12" fill="#e8f0f6"/><text x="972" y="279" text-anchor="start" font-size="22" font-weight="400" fill="#173650"><tspan x="972" dy="0">主要再生资源</tspan><tspan x="972" dy="30.799999999999997">年循环利用量</tspan></text><text x="972" y="370" text-anchor="start" font-size="23" font-weight="600" fill="#173650"><tspan x="972" dy="0">达到5.1亿吨</tspan></text><rect x="1258" y="246" width="286" height="156" rx="12" fill="#e8f0f6"/><text x="1274" y="279" text-anchor="start" font-size="22" font-weight="400" fill="#173650"><tspan x="1274" dy="0">粮食全产业链</tspan><tspan x="1274" dy="30.799999999999997">各环节损失率</tspan></text><text x="1274" y="370" text-anchor="start" font-size="23" font-weight="600" fill="#173650"><tspan x="1274" dy="0">持续降低</tspan></text><text x="50" y="452" text-anchor="start" font-size="27" font-weight="600" fill="#173650"><tspan x="50" dy="0">七个重点任务方向（方案第二至八章）</tspan></text><rect x="50" y="478" width="742" height="60" rx="12" fill="white"/><text x="68" y="516" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="68" dy="0">能源｜深入推进能源节约和能效提升</tspan></text><rect x="808" y="478" width="742" height="60" rx="12" fill="white"/><text x="826" y="516" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="826" dy="0">水资源｜强化水资源节约高效利用</tspan></text><rect x="50" y="553" width="742" height="60" rx="12" fill="white"/><text x="68" y="591" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="68" dy="0">粮食｜深化粮食节约和反食品浪费</tspan></text><rect x="808" y="553" width="742" height="60" rx="12" fill="white"/><text x="826" y="591" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="826" dy="0">土地｜推进土地资源节约集约利用</tspan></text><rect x="50" y="628" width="742" height="60" rx="12" fill="white"/><text x="68" y="666" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="68" dy="0">矿产｜提升矿产资源开发利用水平</tspan></text><rect x="808" y="628" width="742" height="60" rx="12" fill="white"/><text x="826" y="666" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="826" dy="0">原材料｜加强原材料节约和回收循环利用</tspan></text><rect x="50" y="703" width="742" height="60" rx="12" fill="white"/><text x="68" y="741" text-anchor="start" font-size="24" font-weight="400" fill="#173650"><tspan x="68" dy="0">社会风尚｜培育崇尚节约社会风尚</tspan></text><text x="50" y="824" text-anchor="start" font-size="27" font-weight="600" fill="#173650"><tspan x="50" dy="0">支撑保障（方案第九章）</tspan></text><rect x="50" y="848" width="362" height="65" rx="12" fill="#e8f0f6"/><text x="231" y="889" text-anchor="middle" font-size="24" font-weight="400" fill="#173650"><tspan x="231" dy="0">完善法律和标准体系</tspan></text><rect x="428" y="848" width="362" height="65" rx="12" fill="#e8f0f6"/><text x="609" y="889" text-anchor="middle" font-size="24" font-weight="400" fill="#173650"><tspan x="609" dy="0">加大政策支持力度</tspan></text><rect x="806" y="848" width="362" height="65" rx="12" fill="#e8f0f6"/><text x="987" y="889" text-anchor="middle" font-size="24" font-weight="400" fill="#173650"><tspan x="987" dy="0">加强监督管理执法</tspan></text><rect x="1184" y="848" width="362" height="65" rx="12" fill="#e8f0f6"/><text x="1365" y="889" text-anchor="middle" font-size="24" font-weight="400" fill="#173650"><tspan x="1365" dy="0">强化科技创新支撑</tspan></text><text x="50" y="961" text-anchor="start" font-size="22" font-weight="400" fill="#173650"><tspan x="50" dy="0">发布部门　国家发展改革委、工业和信息化部、自然资源部、水利部、国管局。</tspan></text><text x="50" y="999" text-anchor="start" font-size="20" font-weight="400" fill="#173650"><tspan x="50" dy="0">来源　《实施全面节约战略行动方案》（发改环资〔2026〕1424号）正文及国家发展改革委政策解读。</tspan></text><text x="50" y="1040" text-anchor="start" font-size="21" font-weight="400" fill="#173650"><tspan x="50" dy="0">本页介绍国家层面目标和任务。地方具体目标、责任分工和实施安排以本地审定文件为准。</tspan></text></g></svg>