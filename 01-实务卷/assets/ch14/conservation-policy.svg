<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#14304b}.title{font-size:38px;font-weight:600}.body{font-size:23px}.small{font-size:18px}</style><rect width="1600" height="900" fill="#f6f8fb"/><text x="55" y="65" class="title">实施全面节约战略行动方案</text><text x="55" y="105" class="small">国家层面政策要点 · 市直机关处级干部培训</text><text x="55" y="161" class="body">2030年主要目标</text><rect x="55" y="184" width="285" height="142" rx="12" fill="#e5edf5"/><text x="69" y="220" class="small">单位GDP能耗</text><text x="69" y="265" class="body">降低10%左右</text><text x="69" y="302" class="small">比2025年</text><rect x="357" y="184" width="285" height="142" rx="12" fill="#e5edf5"/><text x="371" y="220" class="small">单位GDP用水量</text><text x="371" y="265" class="body">降低10%</text><text x="371" y="302" class="small">比2025年</text><rect x="659" y="184" width="285" height="142" rx="12" fill="#e5edf5"/><text x="673" y="220" class="small">建设用地使用面积</text><text x="673" y="265" class="body">降低15%</text><text x="673" y="302" class="small">比2025年</text><rect x="961" y="184" width="285" height="142" rx="12" fill="#e5edf5"/><text x="975" y="220" class="small">再生资源年循环利用量</text><text x="975" y="265" class="body">达到5.1亿吨</text><text x="975" y="302" class="small">主要再生资源</text><rect x="1263" y="184" width="285" height="142" rx="12" fill="#e5edf5"/><text x="1277" y="220" class="small">粮食全产业链损失率</text><text x="1277" y="265" class="body">持续降低</text><text x="1277" y="302" class="small">各环节</text><text x="55" y="376" class="body">七个重点任务方向</text><rect x="55" y="397" width="735" height="58" rx="12" fill="#ffffff"/><text x="70" y="434" class="body">能源</text><text x="195" y="434" class="small">深入推进能源节约和能效提升</text><rect x="815" y="397" width="735" height="58" rx="12" fill="#ffffff"/><text x="830" y="434" class="body">水资源</text><text x="955" y="434" class="small">强化水资源节约高效利用</text><rect x="55" y="469" width="735" height="58" rx="12" fill="#ffffff"/><text x="70" y="506" class="body">粮食</text><text x="195" y="506" class="small">深化粮食节约和反食品浪费</text><rect x="815" y="469" width="735" height="58" rx="12" fill="#ffffff"/><text x="830" y="506" class="body">土地</text><text x="955" y="506" class="small">推进土地资源节约集约利用</text><rect x="55" y="541" width="735" height="58" rx="12" fill="#ffffff"/><text x="70" y="578" class="body">矿产</text><text x="195" y="578" class="small">提升矿产资源开发利用水平</text><rect x="815" y="541" width="735" height="58" rx="12" fill="#ffffff"/><text x="830" y="578" class="body">原材料</text><text x="955" y="578" class="small">加强原材料节约和回收循环利用</text><rect x="55" y="613" width="735" height="58" rx="12" fill="#ffffff"/><text x="70" y="650" class="body">社会风尚</text><text x="195" y="650" class="small">培育崇尚节约社会风尚</text><text x="55" y="739" class="body">四类支撑保障</text><rect x="265" y="705" width="260" height="52" rx="12" fill="#e5edf5"/><text x="365" y="741" class="body">标准</text><rect x="565" y="705" width="260" height="52" rx="12" fill="#e5edf5"/><text x="665" y="741" class="body">政策</text><rect x="865" y="705" width="260" height="52" rx="12" fill="#e5edf5"/><text x="965" y="741" class="body">监管</text><rect x="1165" y="705" width="260" height="52" rx="12" fill="#e5edf5"/><text x="1265" y="741" class="body">科技</text><text x="55" y="808" class="small">发布部门  国家发展改革委、工业和信息化部、自然资源部、水利部、国管局</text><text x="55" y="841" class="small">来源  《实施全面节约战略行动方案》及国家发展改革委政策解读</text><text x="55" y="874" class="small">地方目标、责任分工和实施安排以本地审定文件为准。</text></svg>