<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#14304b}.title{font-size:38px;font-weight:600}.body{font-size:23px}.small{font-size:18px}</style><rect width="1600" height="1100" fill="#f6f8fb"/><text x="55" y="60" class="title">企业开办“一件事”试点流程</text><rect x="35" y="100" width="380" height="900" rx="12" fill="#e8f0f6"/><text x="65" y="142" class="body">企业</text><rect x="440" y="100" width="560" height="900" rx="12" fill="#eef3f7"/><text x="470" y="142" class="body">综合窗口</text><rect x="1025" y="100" width="540" height="900" rx="12" fill="#e8f0f6"/><text x="1055" y="142" class="body">办理部门</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#446c8b"/></marker></defs><rect x="65" y="185" width="320" height="80" rx="12" fill="#ffffff"/><text x="83" y="217" class="small">网上提交申请</text><text x="83" y="246" class="small">或到综合窗口提交申请</text><path d="M385,225 L610,225" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="610" y="185" width="310" height="80" rx="12" fill="#ffffff"/><text x="628" y="217" class="small">核对材料</text><path d="M765,265 L765,320" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M765,320 L920,390 L765,460 L610,390 Z" fill="#d0e3ef"/><text x="688" y="397" class="small">材料是否齐全？</text><path d="M610,390 L385,390" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="470" y="375" class="small">需补正</text><rect x="65" y="350" width="320" height="90" rx="12" fill="#ffffff"/><text x="83" y="382" class="small">接收一次性补正告知</text><text x="83" y="411" class="small">按要求补齐材料</text><path d="M225,350 L225,295 L550,295 L550,225 L610,225" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M765,460 L765,515" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="785" y="492" class="small">齐全</text><rect x="610" y="515" width="310" height="65" rx="12" fill="#ffffff"/><text x="628" y="547" class="small">统一受理</text><path d="M920,548 L1070,548" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1120" y="330" width="400" height="65" rx="12" fill="#ffffff"/><text x="1138" y="362" class="small">市场监管部门按职责办理</text><path d="M1070,548 L1070,362" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1070,362 L1120,362" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1520,362 L1540,362" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1120" y="440" width="400" height="65" rx="12" fill="#ffffff"/><text x="1138" y="472" class="small">公安部门按职责办理</text><path d="M1070,548 L1070,472" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1070,472 L1120,472" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1520,472 L1540,472" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1120" y="550" width="400" height="65" rx="12" fill="#ffffff"/><text x="1138" y="582" class="small">税务部门按职责办理</text><path d="M1070,548 L1070,582" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1070,582 L1120,582" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1520,582 L1540,582" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1120" y="660" width="400" height="65" rx="12" fill="#ffffff"/><text x="1138" y="692" class="small">人力资源社会保障部门按职责办理</text><path d="M1070,548 L1070,692" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1070,692 L1120,692" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1520,692 L1540,692" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1540,362 L1540,800 L920,800" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="1100" y="775" class="small">各部门办结后反馈结果</text><rect x="610" y="760" width="310" height="95" rx="12" fill="#ffffff"/><text x="628" y="792" class="small">汇总结果</text><text x="628" y="821" class="small">按申请时选定方式通知企业</text><path d="M610,805 L385,805" stroke="#446c8b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="65" y="760" width="320" height="95" rx="12" fill="#ffffff"/><text x="83" y="792" class="small">网上查看结果</text><text x="83" y="821" class="small">或到窗口领取纸质材料</text><text x="55" y="1045" class="small">教学案例。各部门并行办理，具体材料和时限以青岚市现行办事指南为准。</text><polygon points="610.0,225.0 596.0,219.0 596.0,231.0" fill="#446c8b"/><polygon points="765.0,320.0 771.0,306.0 759.0,306.0" fill="#446c8b"/><polygon points="385.0,390.0 399.0,396.0 399.0,384.0" fill="#446c8b"/><polygon points="610.0,225.0 596.0,219.0 596.0,231.0" fill="#446c8b"/><polygon points="765.0,515.0 771.0,501.0 759.0,501.0" fill="#446c8b"/><polygon points="1070.0,548.0 1056.0,542.0 1056.0,554.0" fill="#446c8b"/><polygon points="1070.0,362.0 1064.0,376.0 1076.0,376.0" fill="#446c8b"/><polygon points="1120.0,362.0 1106.0,356.0 1106.0,368.0" fill="#446c8b"/><polygon points="1540.0,362.0 1526.0,356.0 1526.0,368.0" fill="#446c8b"/><polygon points="1070.0,472.0 1064.0,486.0 1076.0,486.0" fill="#446c8b"/><polygon points="1120.0,472.0 1106.0,466.0 1106.0,478.0" fill="#446c8b"/><polygon points="1540.0,472.0 1526.0,466.0 1526.0,478.0" fill="#446c8b"/><polygon points="1070.0,582.0 1076.0,568.0 1064.0,568.0" fill="#446c8b"/><polygon points="1120.0,582.0 1106.0,576.0 1106.0,588.0" fill="#446c8b"/><polygon points="1540.0,582.0 1526.0,576.0 1526.0,588.0" fill="#446c8b"/><polygon points="1070.0,692.0 1076.0,678.0 1064.0,678.0" fill="#446c8b"/><polygon points="1120.0,692.0 1106.0,686.0 1106.0,698.0" fill="#446c8b"/><polygon points="1540.0,692.0 1526.0,686.0 1526.0,698.0" fill="#446c8b"/><polygon points="920.0,800.0 934.0,806.0 934.0,794.0" fill="#446c8b"/><